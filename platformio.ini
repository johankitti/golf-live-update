; Golf Live Update — 64x64 HUB75 leaderboard on ESP32-S3
;
; Default env targets the ESP32-S3 "mini" style boards with the S3FH4R2 chip
; (4 MB flash / 2 MB quad PSRAM), e.g. Electrokit's ESP32-S3 mini.
; For a full-size DevKitC board, use the [env:devkitc] environment instead:
;   pio run -e devkitc -t upload

[platformio]
default_envs = s3mini

[common]
framework = arduino
platform = espressif32
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; serial logs over the native USB port
    -DARDUINO_USB_MODE=1
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.0
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit GFX Library@^1.11.0

[env:s3mini]
framework = ${common.framework}
platform = ${common.platform}
board = lolin_s3_mini              ; same chip config as generic S3 mini boards
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

[env:devkitc]
framework = ${common.framework}
platform = ${common.platform}
board = esp32-s3-devkitc-1
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
